<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sensor Tangan</title>
<style>
  :root{
    --bg: #0b0f14;
    --panel: #10161d;
    --accent: #5eead4;
    --accent2: #f472b6;
    --text: #e7edf3;
    --muted: #7c8b9a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100%;
    width: 100%;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1); /* mirror biar natural kayak cermin */
    filter: brightness(0.55) saturate(1.1);
  }
  canvas#overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
    pointer-events: none;
  }
  #box {
    position: absolute;
    width: 70px;
    height: 70px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 0 30px rgba(94,234,212,0.55), 0 0 0 2px rgba(255,255,255,0.15) inset;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: box-shadow 0.15s ease;
    pointer-events: none;
    z-index: 5;
  }
  #box.grabbed {
    box-shadow: 0 0 45px rgba(244,114,182,0.85), 0 0 0 2px rgba(255,255,255,0.4) inset;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px 18px calc(16px + env(safe-area-inset-top)) 18px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
  }
  #hud .title {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #hud .status {
    margin-top: 4px;
    font-size: 15px;
    font-weight: 600;
  }
  #status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ef4444;
    margin-right: 6px;
  }
  #status-dot.live { background: var(--accent); }

  #startOverlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: radial-gradient(circle at 50% 30%, #16202b, #0b0f14 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  #startOverlay h1 {
    font-size: 22px;
    margin: 0 0 8px;
  }
  #startOverlay p {
    color: var(--muted);
    font-size: 14px;
    max-width: 320px;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  #startBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #06110e;
    border: none;
    padding: 14px 32px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  #errorBox {
    display: none;
    margin-top: 18px;
    color: #f87171;
    font-size: 13px;
    max-width: 320px;
  }
  #loading {
    display: none;
    margin-top: 18px;
    color: var(--muted);
    font-size: 13px;
  }
  #hint {
    position: absolute;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    text-align: center;
    z-index: 10;
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
  <div id="box"></div>

  <div id="hud">
    <div>
      <div class="title">Sensor Tangan</div>
      <div class="status"><span id="status-dot"></span><span id="status-text">Menunggu kamera</span></div>
    </div>
  </div>

  <div id="hint">Kepalkan tangan di dekat kotak untuk menggenggam &amp; menggeser</div>

  <div id="startOverlay">
    <h1>Gerakkan kotak pakai tangan</h1>
    <p>Izinkan akses kamera depan. Dekatkan tangan ke kotak, kepalkan jari untuk "menggenggam", lalu geser tangan ke mana saja.</p>
    <button id="startBtn">Aktifkan Kamera</button>
    <div id="loading">Memuat model deteksi tangan…</div>
    <div id="errorBox"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const box = document.getElementById('box');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const errorBox = document.getElementById('errorBox');
const loading = document.getElementById('loading');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

let boxX = window.innerWidth / 2;
let boxY = window.innerHeight / 2;
let grabbed = false;
let grabOffsetX = 0, grabOffsetY = 0;

function resizeCanvas(){
  overlay.width = overlay.clientWidth;
  overlay.height = overlay.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

function setBoxPosition(x, y){
  boxX = x; boxY = y;
  box.style.left = x + 'px';
  box.style.top = y + 'px';
}
setBoxPosition(boxX, boxY);

// Hitung jarak antar 2 titik landmark
function dist(a, b){
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// Deteksi kepalan tangan sederhana: ujung jari (selain jempol) lebih dekat
// ke pergelangan dibanding buku jari tengahnya -> jari menekuk
function isFist(landmarks){
  const wrist = landmarks[0];
  const tips = [8, 12, 16, 20];
  const pips = [6, 10, 14, 18];
  let curled = 0;
  for(let i=0;i<tips.length;i++){
    if(dist(landmarks[tips[i]], wrist) < dist(landmarks[pips[i]], wrist)){
      curled++;
    }
  }
  return curled >= 3;
}

function onResults(results){
  ctx.save();
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  const hasHand = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;

  if(hasHand){
    statusDot.classList.add('live');
    statusText.textContent = 'Tangan terdeteksi';

    const landmarks = results.multiHandLandmarks[0];

    // gambar titik-titik tangan
    ctx.fillStyle = 'rgba(94,234,212,0.9)';
    ctx.strokeStyle = 'rgba(94,234,212,0.5)';
    ctx.lineWidth = 2;
    const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
      [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
      [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
    connections.forEach(([a,b])=>{
      ctx.beginPath();
      ctx.moveTo(landmarks[a].x * overlay.width, landmarks[a].y * overlay.height);
      ctx.lineTo(landmarks[b].x * overlay.width, landmarks[b].y * overlay.height);
      ctx.stroke();
    });
    landmarks.forEach(p=>{
      ctx.beginPath();
      ctx.arc(p.x * overlay.width, p.y * overlay.height, 3, 0, Math.PI*2);
      ctx.fill();
    });

    // posisi tangan pakai titik pangkal telapak (landmark 9)
    const palm = landmarks[9];
    // Video di-mirror lewat CSS scaleX(-1), tapi canvas overlay & kotak
    // ada di container yang sama (tidak ikut mirror), jadi kita perlu
    // mirror koordinat X manual supaya gerakan match sama yang dilihat user.
    const handX = (1 - palm.x) * overlay.width;
    const handY = palm.y * overlay.height;

    const fist = isFist(landmarks);
    const distToBox = Math.hypot(handX - boxX, handY - boxY);

    if(fist && !grabbed && distToBox < 90){
      grabbed = true;
      grabOffsetX = boxX - handX;
      grabOffsetY = boxY - handY;
    }
    if(!fist && grabbed){
      grabbed = false;
    }

    if(grabbed){
      let nx = handX + grabOffsetX;
      let ny = handY + grabOffsetY;
      nx = Math.max(35, Math.min(overlay.width - 35, nx));
      ny = Math.max(35, Math.min(overlay.height - 35, ny));
      setBoxPosition(nx, ny);
      box.classList.add('grabbed');
    } else {
      box.classList.remove('grabbed');
    }
  } else {
    statusDot.classList.remove('live');
    statusText.textContent = 'Tangan tidak terlihat';
    grabbed = false;
    box.classList.remove('grabbed');
  }

  ctx.restore();
}

async function start(){
  loading.style.display = 'block';
  errorBox.style.display = 'none';
  startBtn.disabled = true;

  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    resizeCanvas();

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 640,
      height: 480
    });
    camera.start();

    startOverlay.style.display = 'none';
  } catch(err){
    loading.style.display = 'none';
    startBtn.disabled = false;
    errorBox.style.display = 'block';
    errorBox.textContent = 'Gagal mengakses kamera: ' + err.message + '. Pastikan izin kamera diaktifkan di browser (biasanya lewat ikon gembok/kamera di address bar), dan buka lewat HTTPS.';
  }
}

startBtn.addEventListener('click', start);
</script>
</body>
</html>
